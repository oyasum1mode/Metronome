<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f05e23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metronome">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Metronome Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0c;--sf:#141418;--s2:#1a1a20;--bd:#222228;--tx:#e8e6e1;--dm:#6b6a66;--mt:#444440;
--ac:#f05e23;--ag:rgba(240,94,35,.25);--as:rgba(240,94,35,.08);
--ba:#f05e23;--bi:#2a2a30;--bac:#ff7a45;
--ci:#a78bfa;--cig:rgba(167,139,250,.3);--ec:#34d399;--ecg:rgba(52,211,153,.3);
--red:#ef4444;--endc:#f59e0b;--endg:rgba(245,158,11,.3)}
html,body{overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:'DM Mono',monospace;min-height:100vh;height:100vh;height:100svh;display:flex;align-items:stretch;justify-content:center;overflow:hidden;padding-top:8px;padding-top:max(8px,env(safe-area-inset-top,8px));padding-right:8px;padding-right:max(8px,env(safe-area-inset-right,8px));padding-bottom:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,16px));padding-left:8px;padding-left:max(8px,env(safe-area-inset-left,8px))}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 600px 400px at 50% 30%,rgba(240,94,35,.03)0%,transparent 70%);pointer-events:none}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;min-height:0;padding:8px 4px 0}
.hd{text-align:center;margin-bottom:8px;position:relative}
.hd h1{font-family:'Instrument Serif',serif;font-size:20px;font-weight:400}
.hd .sub{font-size:8px;color:var(--dm);letter-spacing:.3em;text-transform:uppercase;margin-top:1px}
.vol{position:absolute;right:0;top:0;display:flex;align-items:center;gap:5px;color:var(--dm)}
.vol span{font-size:12px;line-height:1}
.vol input{width:88px}
.tabs{display:flex;gap:2px;margin-bottom:10px;background:var(--sf);border-radius:6px;padding:2px}
.tb{flex:1;min-height:44px;padding:5px 2px;border:none;background:transparent;color:var(--dm);font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:all .15s;white-space:nowrap;touch-action:manipulation}
.tb.active{background:var(--as);color:var(--ac);border:1px solid rgba(240,94,35,.2)}
.tc{display:none;min-height:0}
.tc.active{display:block}
.play-tab.active{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
#tab-metro.play-tab.active,#tab-perf.play-tab.active{touch-action:pan-x pinch-zoom;overscroll-behavior:contain}
.play-top{display:flex;flex-direction:column;gap:4px}
.play-bottom{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-bottom:4px}
.bv{font-family:'Instrument Serif',serif;font-size:60px;font-weight:400;line-height:1;text-align:center;transition:color .08s}
.bv.f1{color:var(--ac)}.bv.f2{color:var(--ci)}.bv.f3{color:var(--ec)}.bv.f4{color:var(--endc)}
.bs{font-size:10px;color:var(--dm);letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-top:2px}
.tn{font-family:'Instrument Serif',serif;font-style:italic;font-size:13px;color:var(--dm);text-align:center;margin-top:3px;min-height:16px}
.trend{display:inline-block;margin-left:5px;color:var(--ac);font-family:'DM Mono',monospace;font-size:12px;font-style:normal}
.stb{text-align:center;margin-bottom:4px;min-height:14px}
.stb span{font-family:'Instrument Serif',serif;font-size:13px;color:var(--dm);font-style:italic}
.sb{text-align:center;margin-bottom:8px;min-height:20px}
.tg{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;letter-spacing:.06em}
.tg-n{background:var(--as);border:1px solid rgba(240,94,35,.2);color:var(--ac)}
.tg-ci{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:var(--ci)}
.tg-ec{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--ec)}
.tg-end{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--endc)}
.tg-off{opacity:.4}
.mc{font-size:9px;color:var(--dm);margin-top:2px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:10px;min-height:32px;align-items:center;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;background:var(--bi);transition:all .05s}
.dot.on{background:var(--ba);box-shadow:0 0 10px var(--ag);transform:scale(1.3)}
.dot.acc{border:1.5px solid var(--dm)}.dot.acc.on{background:var(--bac);border-color:var(--bac)}
.dot.ci{background:var(--ci);box-shadow:0 0 10px var(--cig);transform:scale(1.3)}
.dot.ec{background:var(--ec);box-shadow:0 0 10px var(--ecg);transform:scale(1.3)}
.dot.ed{background:var(--endc);box-shadow:0 0 10px var(--endg);transform:scale(1.3)}
.subdot{width:5px;height:5px;border-radius:50%;background:var(--dm);opacity:.5;transition:opacity .08s,background .08s,transform .08s}
.subdot.on{background:var(--ba);opacity:1;transform:scale(1.5)}
.sw{margin-bottom:8px;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--bd);border-radius:2px;outline:none;touch-action:pan-x}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ac);cursor:pointer;box-shadow:0 0 6px var(--ag)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ac);cursor:pointer;border:none}
.sll{display:flex;justify-content:space-between;margin-top:3px;font-size:9px;color:var(--dm)}
.fine{display:flex;justify-content:center;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.fb{min-width:44px;min-height:44px;padding:0 11px;border-radius:22px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;user-select:none;touch-action:manipulation}
.fb:hover{border-color:var(--ac);color:var(--ac)}.fb:active{transform:scale(.93)}
.tsw{margin-bottom:8px;text-align:center}
.tsl{font-size:9px;color:var(--dm);letter-spacing:.15em;text-transform:uppercase;margin-bottom:3px}
.tsv{font-family:'Instrument Serif',serif;font-size:20px;margin-bottom:3px}
.subctl{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.subctl .tsl{margin-bottom:0}
.subbtn{min-width:92px;min-height:36px;padding:8px 14px;border-radius:18px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;transition:all .12s;touch-action:manipulation}
.subbtn:hover{border-color:var(--ac);color:var(--ac)}
.subbtn:active{transform:scale(.96)}
.orow{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tgg{display:flex;align-items:center;gap:7px}
.tgl{font-size:10px;color:var(--dm);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tw{width:52px;height:32px;border-radius:16px;background:var(--bd);cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0}
.tw.on{background:var(--ac)}.tw.og{background:var(--ec)}
.tw::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:var(--tx);top:5px;left:5px;transition:transform .2s}
.tw.on::after,.tw.og::after{transform:translateX(20px)}
.sg{display:flex;gap:4px}
.so{min-height:44px;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--dm);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .1s}
.so.ap{border-color:var(--ci);color:var(--ci);background:rgba(167,139,250,.08)}
.so.ag{border-color:var(--ec);color:var(--ec);background:rgba(52,211,153,.08)}
.rrow{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.rl{font-size:8px;color:var(--dm);letter-spacing:.08em;text-transform:uppercase}
.rs{background:var(--sf);border:1px solid var(--bd);border-radius:8px;min-height:44px;padding:3px 10px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;min-width:64px;text-align:center}
.rs:focus{border-color:var(--ac)}
.ra{color:var(--dm);font-size:11px}
.pw{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:8px}
.pb{width:64px;height:64px;border-radius:50%;border:2px solid var(--ac);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative;touch-action:manipulation}
#tab-metro .pb,#tab-perf .pb{width:220px;height:64px;border-radius:32px}
#tab-metro .tapb{height:64px;min-width:110px;border-radius:32px;margin:0}
.pb:hover{background:var(--as);box-shadow:0 0 16px var(--ag)}
.pb:active{transform:scale(.94)}.pb.on{background:var(--ac)}
.pi{width:18px;height:18px}
.pb .tri{fill:var(--ac)}.pb.on .tri{fill:var(--bg)}
.pb .bar{fill:var(--ac)}.pb.on .bar{fill:var(--bg)}
.pr{position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--ac);opacity:0;pointer-events:none}
.pr.pulse{animation:po .3s ease-out}
@keyframes po{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.4);opacity:0}}
.tapb{min-height:44px;padding:10px 18px;border-radius:22px;border:1px solid var(--bd);background:transparent;color:var(--dm);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .12s}
.tapb:hover{border-color:var(--dm);color:var(--tx)}.tapb:active{transform:scale(.95);border-color:var(--ac);color:var(--ac)}
.sh{display:flex;gap:6px;margin-bottom:10px}
.sti{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:7px 10px;color:var(--tx);font-family:'Instrument Serif',serif;font-size:16px;outline:none}
.sti:focus{border-color:var(--ac)}.sti::placeholder{color:var(--mt)}
.sa{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.sab{padding:4px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--sf);color:var(--dm);font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;transition:all .12s}
.sab:hover{border-color:var(--ac);color:var(--ac)}
.sab.pri{border-color:var(--ac);color:var(--ac);background:var(--as)}
.sab.danger:hover{border-color:var(--red);color:var(--red)}
.slist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;transition:border-color .15s}
.sc.playing{border-color:var(--ac);box-shadow:0 0 8px rgba(240,94,35,.08)}
.sc.is-end{border-left:2px solid var(--endc)}
.sch{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.slet{font-family:'Instrument Serif',serif;font-size:17px;color:var(--ac);min-width:28px}
.slet.el{color:var(--endc)}
.sni{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:2px 6px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;outline:none}
.sni:focus{border-color:var(--ac)}
.smv{display:flex;flex-direction:column;gap:1px}
.mvb{width:18px;height:14px;border-radius:2px;border:1px solid var(--bd);background:transparent;color:var(--dm);cursor:pointer;font-size:8px;display:flex;align-items:center;justify-content:center;transition:all .1s;padding:0}
.mvb:hover{border-color:var(--ac);color:var(--ac)}
.sdel{width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--mt);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.sdel:hover{border-color:var(--red);color:var(--red)}
.sfs{display:grid;gap:4px}
.sfs.f4{grid-template-columns:1fr 1fr 1fr 1fr}
.sfs.f2{grid-template-columns:1fr 1fr}
.sdet{margin-top:6px;border-top:1px solid var(--bd);padding-top:5px}
.sdet summary{min-height:28px;display:flex;align-items:center;color:var(--dm);font-size:9px;cursor:pointer;list-style:none;user-select:none}
.sdet summary::-webkit-details-marker{display:none}
.sdet summary::before{content:'⋯';margin-right:6px;color:var(--ac)}
.curvev{font-size:8px;color:var(--dm);margin-top:3px;text-align:right}
.fg label{display:block;font-size:7px;color:var(--dm);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.fg input,.fg select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:3px 4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--ac)}
.fg select{-webkit-appearance:none;appearance:none;cursor:pointer}
.abr{display:flex;gap:4px;margin-bottom:10px}
.adb{flex:1;padding:8px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--dm);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .12s}
.adb:hover{border-color:var(--ac);color:var(--ac)}
.adb.ea{border-color:rgba(245,158,11,.3);color:var(--endc)}.adb.ea:hover{border-color:var(--endc)}
.sinf{text-align:center;font-size:8px;color:var(--dm);margin-top:8px;line-height:1.5}
.ll{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.lc{background:var(--sf);border:1px solid var(--bd);border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .12s}
.lc:hover{border-color:var(--ac)}.lc.cur{border-color:var(--ac);background:var(--as)}
.lci{flex:1;min-width:0}
.lct{font-family:'Instrument Serif',serif;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcm{font-size:8px;color:var(--dm);margin-top:2px}
.lca{display:flex;gap:3px;flex-shrink:0}
.lib{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--dm);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.lib:hover{border-color:var(--ac);color:var(--ac)}.lib.dg:hover{border-color:var(--red);color:var(--red)}
.le{text-align:center;padding:24px 8px;color:var(--mt);font-size:11px}
.nsb{width:100%;padding:8px;border-radius:7px;border:1px dashed var(--bd);background:transparent;color:var(--dm);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .12s;margin-bottom:10px}
.nsb:hover{border-color:var(--ac);color:var(--ac)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.show{opacity:1;pointer-events:auto}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:20px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
.md h3{font-family:'Instrument Serif',serif;font-size:16px;font-weight:400;margin-bottom:10px}
.mdt{font-size:10px;color:var(--dm);margin-bottom:8px;line-height:1.5}
.md textarea{width:100%;height:90px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:7px;color:var(--tx);font-family:'DM Mono',monospace;font-size:8px;outline:none;resize:vertical;word-break:break-all}
.md textarea:focus{border-color:var(--ac)}
.mdb{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.mb{padding:6px 14px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--dm);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .12s}
.mb:hover{border-color:var(--dm);color:var(--tx)}.mb.pri{border-color:var(--ac);color:var(--ac);background:var(--as)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:6px 16px;border-radius:16px;font-size:10px;font-family:'DM Mono',monospace;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
#tab-song.active,#tab-lib.active{display:block;overflow:auto;padding-bottom:8px}
@media (max-height:700px){
  .hd{margin-bottom:6px}
  .hd h1{font-size:18px}
  .vol input{width:72px}
  .tabs{margin-bottom:8px}
  .bv{font-size:48px}
  .tn{font-size:12px}
  .dots{gap:3px;margin-bottom:8px;min-height:24px}
  .dot{width:16px;height:16px}
  .subdot{width:4px;height:4px}
  .subctl{margin-bottom:8px}
  .orow,.rrow,.fine,.pw{margin-bottom:6px}
  #tab-metro .pb,#tab-perf .pb{width:220px;height:64px}
}
@media (orientation:landscape) and (max-height:500px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .play-tab.active{min-height:auto}
}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><h1>Metronome</h1><div class="sub">precision timing</div><label class="vol" aria-label="音量"><span>VOL</span><input type="range" id="volSlider" min="0" max="1.5" step="0.05" value="1"></label></div>
  <div class="tabs">
    <button class="tb active" data-t="metro">テンポ</button>
    <button class="tb" data-t="perf">パフォーマンス</button>
    <button class="tb" data-t="song">曲編集</button>
    <button class="tb" data-t="lib">ライブラリ</button>
  </div>

  <div class="tc active play-tab" id="tab-metro">
    <div class="play-top">
      <div class="bv" id="mBv">120</div><div class="bs">bpm</div><div class="tn" id="mTn">Allegro</div>
      <div class="dots" id="mDt"></div>
    </div>
    <div class="play-bottom">
      <div class="sw"><input type="range" id="mSl" min="20" max="400" value="120"><div class="sll"><span>20</span><span>400</span></div></div>
      <div class="fine">
        <button class="fb" data-d="-10">−10</button><button class="fb" data-d="-5">−5</button><button class="fb" data-d="-1">−1</button>
        <button class="fb" data-d="1">+1</button><button class="fb" data-d="5">+5</button><button class="fb" data-d="10">+10</button>
      </div>
      <div class="tsw"><div class="tsl">拍子</div><div class="tsv" id="mTs">4/4</div><input type="range" id="mTsSl" min="1" max="8" value="4" style="max-width:200px"></div>
      <div class="subctl"><div class="tsl">Subdivision</div><button class="subbtn" id="mSubBtn" type="button">—</button></div>
      <div class="pw"><button class="tapb" id="tapB">Tap Tempo</button><button class="pb" id="mPb"><div class="pr" id="mPr"></div><svg class="pi" id="mPi" viewBox="0 0 24 24"><polygon class="tri" points="8,5 20,12 8,19"/></svg></button></div>
    </div>
  </div>

  <div class="tc play-tab" id="tab-perf">
    <div class="play-top">
      <div class="stb" id="pST"></div>
      <div class="bv" id="pBv">120</div><div class="bs">bpm</div><div class="tn"><span id="pTn">Allegro</span><span class="trend" id="pTrend"></span></div>
      <div class="sb" id="pSB"></div>
      <div class="dots" id="pDt"></div>
    </div>
    <div class="play-bottom">
      <div class="orow">
        <div class="tgg"><span class="tgl">Tap Off</span><button class="tw" id="ciT"></button></div>
        <div class="sg" id="ciS"><button class="so ap" data-v="4">4</button><button class="so" data-v="8">8</button></div>
      </div>
      <div class="orow">
        <div class="tgg"><span class="tgl">End Check</span><button class="tw" id="ecT"></button></div>
        <div class="sg" id="ecBS"><button class="so ag" data-v="4">4拍</button><button class="so" data-v="8">8拍</button></div>
        <div class="sg" id="ecTS"><button class="so ag" data-v="before">前テンポ</button><button class="so" data-v="after">後テンポ</button></div>
      </div>
      <div class="rrow" id="rR">
        <span class="rl">範囲</span><select class="rs" id="rF"></select><span class="ra">→</span><select class="rs" id="rT"></select>
      </div>
      <div class="subctl"><div class="tsl">Subdivision</div><button class="subbtn" id="pSubBtn" type="button">—</button></div>

<div class="mo" id="exM"><div class="md"><h3>エクスポート</h3><div class="mdt">コードをコピーして共有</div><textarea id="exA" readonly></textarea><div class="mdb"><button class="mb" id="exCl">閉じる</button><button class="mb pri" id="exCp">コピー</button></div></div></div>
<div class="mo" id="imM"><div class="md"><h3>インポート</h3><div class="mdt">コードを貼り付け</div><textarea id="imA" placeholder="ここに貼り付け…"></textarea><div class="mdb"><button class="mb" id="imCl">閉じる</button><button class="mb pri" id="imLd">読み込み</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);

const LOOKAHEAD_MS=25;
const SCHEDULE_AHEAD_TIME=.1;
const VISUAL_LEAD_TIME=.02;
const SUBDIVISION_STATES=[
  {key:'none',label:'—',parts:1},
  {key:'8th',label:'8th',parts:2},
  {key:'triplet',label:'Tri',parts:3},
  {key:'16th',label:'16th',parts:4}
];
let actx=null,masterGain=null,noiseBuffer=null;
let schedulerTimer=null,visualTimer=null,activeTransport=null,noteQueue=[];
let wakeLockSentinel=null;
let masterVolume=parseFloat(localStorage.getItem('metronome-volume'));
if(!Number.isFinite(masterVolume))masterVolume=1;

function ea(){
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=actx.createGain();
    masterGain.gain.value=masterVolume;
    masterGain.connect(actx.destination);
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function getNoiseBuffer(c){
  if(noiseBuffer)return noiseBuffer;
  const blen=Math.ceil(c.sampleRate*.05),buf=c.createBuffer(1,blen,c.sampleRate),bd=buf.getChannelData(0);
  for(let i=0;i<blen;i++)bd[i]=Math.random()*2-1;
  noiseBuffer=buf;
  return noiseBuffer;
}
function applyMasterVolume(v){
  masterVolume=Math.max(0,Math.min(1.5,Number.isFinite(v)?v:1));
  if(masterGain&&actx)masterGain.gain.setValueAtTime(masterVolume,actx.currentTime);
}
function resetMasterGain(){
  const c=ea(),now=c.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterVolume,now);
}
function muteMasterGain(){
  if(!actx||!masterGain)return;
  const now=actx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setTargetAtTime(.0001,now,.003);
}
function playClick(type,time,opts={}){
  const c=ea();
  const when=Math.max(time,c.currentTime);
  const defaults={
    accent:{f0:220,f:[900,1500,2700],q:10,vPeak:.45,cPeak:.5,vDecay:.10,cDecay:.020},
    normal:{f0:180,f:[730,1300,2400],q:10,vPeak:.38,cPeak:.4,vDecay:.08,cDecay:.016},
    ci:{f0:260,f:[320,2200,2900],q:10,vPeak:.4,cPeak:.45,vDecay:.09,cDecay:.018},
    sub:{f0:150,f:[570,900,2400],q:10,vPeak:.18,cPeak:.18,vDecay:.05,cDecay:.012}
  };
  const d=defaults[type]||defaults.normal;
  const f0=opts.f0??opts.frequency??d.f0;
  const formants=opts.formants??d.f;
  const q=opts.Q??d.q;
  const vPeak=opts.vowelPeak??opts.toneGain??d.vPeak;
  const cPeak=opts.consonantPeak??opts.noiseGain??d.cPeak;
  const vDecay=opts.vowelDecay??opts.toneDecay??d.vDecay;
  const cDecay=opts.consonantDecay??d.cDecay;
  const osc=c.createOscillator(),vowelGain=c.createGain();
  osc.type=opts.waveform||'square';
  osc.frequency.value=f0;
  vowelGain.gain.setValueAtTime(.0001,when);
  vowelGain.gain.exponentialRampToValueAtTime(vPeak,when+.001);
  vowelGain.gain.exponentialRampToValueAtTime(.0001,when+vDecay);
  formants.forEach(fc=>{
    const bpf=c.createBiquadFilter();
    bpf.type='bandpass';
    bpf.frequency.value=fc;
    bpf.Q.value=q;
    osc.connect(bpf);
    bpf.connect(vowelGain);
  });
  vowelGain.connect(masterGain);
  osc.start(when);
  osc.stop(when+vDecay+.02);
  const noise=c.createBufferSource(),hpf=c.createBiquadFilter(),consonantGain=c.createGain();
  noise.buffer=getNoiseBuffer(c);
  hpf.type='highpass';
  hpf.frequency.value=3000;
  consonantGain.gain.setValueAtTime(.0001,when);
  consonantGain.gain.exponentialRampToValueAtTime(cPeak,when+.0008);
  consonantGain.gain.exponentialRampToValueAtTime(.0001,when+cDecay);
  noise.connect(hpf);hpf.connect(consonantGain);consonantGain.connect(masterGain);
  noise.start(when);
  noise.stop(when+cDecay+.02);
}
function queueVisual(evt){
  noteQueue.push(evt);
  noteQueue.sort((a,b)=>a.time-b.time);
}
function clearRuntimeTimers(){
  if(schedulerTimer){clearInterval(schedulerTimer);schedulerTimer=null}
  if(visualTimer){cancelAnimationFrame(visualTimer);visualTimer=null}
}
function clearNoteQueue(){noteQueue.length=0}
function flashBpm(id,cls){
  const el=$(id);
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),80);
}
function pulseRing(id){
  const el=$(id);
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}
function paintDots(id,activeIndex,cls){
  const dots=$(id).querySelectorAll('.dot');
  dots.forEach(dot=>{dot.className=dot.classList.contains('acc')?'dot acc':'dot'});
  if(dots[activeIndex])dots[activeIndex].classList.add(cls);
}
function paintSubdot(id,beatIndex,subIndex){
  const el=$(id).querySelector(`.subdot[data-beat="${beatIndex}"][data-sub="${subIndex}"]`);
  if(!el)return;
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),90);
}
function clearDotLights(id){
  $(id).querySelectorAll('.dot').forEach(d=>{d.className=d.classList.contains('acc')?'dot acc':'dot'});
  $(id).querySelectorAll('.subdot').forEach(d=>d.classList.remove('on'));
}
function applyVisual(evt){
  if(evt.panel==='metro'){
    if(evt.kind==='sub'){paintSubdot('mDt',evt.beatIndex,evt.subIndex);return}
    paintDots('mDt',evt.beatIndex,'on');
    flashBpm('mBv',evt.flashClass||'f1');
    pulseRing('mPr');
    return;
  }
  if(evt.panel==='perf'){
    if(evt.kind==='sub'){paintSubdot('pDt',evt.beatIndex,evt.subIndex);return}
    if(evt.kind==='tempo'){pBpm=evt.bpm;pUpd();return}
    paintDots('pDt',evt.beatIndex,evt.dotClass||'on');
    flashBpm('pBv',evt.flashClass||'f1');
    pulseRing('pPr');
  }
}
function stopTransport(mute=true){
  if(mute)muteMasterGain();
  if(activeTransport&&typeof activeTransport.cleanup==='function')activeTransport.cleanup();
  activeTransport=null;
  clearRuntimeTimers();
  clearNoteQueue();
}
function finalizeTransportIfDone(){
  if(!activeTransport||activeTransport.isRunning||noteQueue.length>0)return;
  const doneTransport=activeTransport;
  activeTransport=null;
  clearRuntimeTimers();
  if(doneTransport&&typeof doneTransport.onComplete==='function')doneTransport.onComplete();
}
function runScheduler(){
  if(!activeTransport)return;
  const c=ea();
  let guard=0;
  while(activeTransport.isRunning&&activeTransport.nextNoteTime<c.currentTime+SCHEDULE_AHEAD_TIME){
    activeTransport.scheduleNext(activeTransport.nextNoteTime);
    activeTransport.advance();
    guard++;
    if(guard>128){console.warn('scheduler guard tripped');break}
  }
  finalizeTransportIfDone();
}
function runVisuals(){
  const now=actx?actx.currentTime:0;
  while(noteQueue.length&&noteQueue[0].time<=now+VISUAL_LEAD_TIME){
    applyVisual(noteQueue.shift());
  }
  finalizeTransportIfDone();
  if(activeTransport||noteQueue.length>0)visualTimer=requestAnimationFrame(runVisuals);
}
function startTransport(transport){
  stopTransport(false);
  resetMasterGain();
  clearNoteQueue();
  activeTransport=transport;
  schedulerTimer=setInterval(runScheduler,LOOKAHEAD_MS);
  runScheduler();
  runVisuals();
}
async function requestWakeLock(){
  if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||(!mPlaying&&!pPlaying))return;
  try{
    wakeLockSentinel=await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release',()=>{
      if(wakeLockSentinel&&wakeLockSentinel.released)wakeLockSentinel=null;
    });
  }catch(e){}
}
async function releaseWakeLock(){
  if(!wakeLockSentinel)return;
  const lock=wakeLockSentinel;
  wakeLockSentinel=null;
  try{await lock.release()}catch(e){}
}
function syncWakeLock(){
  if(mPlaying||pPlaying)requestWakeLock();
  else releaseWakeLock();
}
$('volSlider').value=String(masterVolume);
$('volSlider').addEventListener('input',e=>{
  const v=parseFloat(e.target.value);
  applyMasterVolume(v);
  localStorage.setItem('metronome-volume',String(masterVolume));
});

function secLabel(n){
  if(n<26)return String.fromCharCode(65+n);
  return String.fromCharCode(65+Math.floor(n/26)-1)+String.fromCharCode(65+(n%26));
}
function assignLabels(){
  let mi=0;
  secs.forEach(s=>{if(s.type==='end')s.label='End';else{s.label=secLabel(mi);mi++}});
}
function tN(b){if(b<40)return'Grave';if(b<55)return'Largo';if(b<66)return'Larghetto';if(b<76)return'Adagio';if(b<92)return'Andante';if(b<108)return'Moderato';if(b<120)return'Allegretto';if(b<156)return'Allegro';if(b<176)return'Vivace';if(b<200)return'Presto';return'Prestissimo'}
function clampTempo(v){return Math.max(20,Math.min(400,v||120))}
function clampBeats(v){return Math.max(1,Math.min(8,v||4))}
function clampCurve(v){return Math.max(-1,Math.min(1,Number.isFinite(v)?v:0))}
function normalizeSection(s){
  const n={type:s.type||s.tp||'main',label:s.label||'',name:s.name||s.n||'',startMeasure:s.startMeasure??s.sm??1,measures:s.measures??s.m??0,tempo:clampTempo(s.tempo??s.t??120),timeSig:clampBeats(s.timeSig??s.ts??4)};
  if(n.type==='main'){
    n.tempoEnd=clampTempo(s.tempoEnd??s.te??n.tempo);
    n.tempoCurve=clampCurve(parseFloat(s.tempoCurve??s.tc??0));
  }else{
    n.measures=1;
  }
  return n;
}
function normalizeSections(list){return(list||[]).map(normalizeSection)}
function progress(sec,beatIndex,measureIndex){
  if(!sec||sec.measures<=0)return 0;
  const totalBeats=sec.measures*clampBeats(sec.timeSig);
  return Math.min(1,(measureIndex*clampBeats(sec.timeSig)+beatIndex)/totalBeats);
}
function tempoAt(sec,t){
  const start=clampTempo(sec&&sec.tempo),end=clampTempo(sec&&(sec.tempoEnd??sec.tempo));
  if(start===end)return start;
  const v=clampCurve(parseFloat(sec.tempoCurve??0));
  const tt=Math.pow(t,Math.pow(2,v));
  return start+(end-start)*tt;
}
function getSubdivisionState(key){return SUBDIVISION_STATES.find(s=>s.key===key)||SUBDIVISION_STATES[0]}
function cycleSubdivision(key){
  const idx=SUBDIVISION_STATES.findIndex(s=>s.key===key);
  return SUBDIVISION_STATES[(idx+1)%SUBDIVISION_STATES.length];
}
function renderDots(id,beats,subdivisionKey){
  const el=$(id),sub=getSubdivisionState(subdivisionKey);
  el.innerHTML='';
  for(let i=0;i<beats;i++){
    const d=document.createElement('div');
    d.className='dot';
    if(beats>1&&i===0)d.classList.add('acc');
    el.appendChild(d);
    for(let j=1;j<sub.parts;j++){
      const sd=document.createElement('div');
      sd.className='subdot';
      sd.dataset.beat=i;
      sd.dataset.sub=j;
      el.appendChild(sd);
    }
  }
}
function scheduleSubdivision(beatTime,beatDuration,key,panel,beatIndex){
  const sub=getSubdivisionState(key);
  if(sub.parts<=1)return;
  const step=beatDuration/sub.parts;
  for(let i=1;i<sub.parts;i++){
    const subTime=beatTime+step*i;
    playClick('sub',subTime);
    if(panel)queueVisual({kind:'sub',panel,time:subTime,beatIndex,subIndex:i});
  }
}

let mBpm=120,mBeats=4,mPlaying=false,mSubdivision='none';
function mUpd(){$('mBv').textContent=mBpm;$('mTn').textContent=tN(mBpm);$('mSl').value=mBpm;$('mTs').textContent=mBeats===1?'1':mBeats+'/4';$('mTsSl').value=mBeats}
function mSetBpm(v){mBpm=clampTempo(v);mUpd()}
function mDots(){renderDots('mDt',mBeats,mSubdivision)}
function mUpdSubdivision(){$('mSubBtn').textContent=getSubdivisionState(mSubdivision).label;mDots()}
function createMetroTransport(){
  const c=ea();
  return{
    isRunning:true,
    nextNoteTime:c.currentTime+.05,
    beatIndex:0,
    scheduleNext(time){
      const accent=(mBeats===1)||this.beatIndex===0;
      const beatDuration=60/mBpm;
      playClick(accent?'accent':'normal',time);
      scheduleSubdivision(time,beatDuration,mSubdivision,'metro',this.beatIndex);
      queueVisual({panel:'metro',time,beatIndex:this.beatIndex,flashClass:'f1'});
    },
    advance(){
      this.nextNoteTime+=60/mBpm;
      this.beatIndex=(this.beatIndex+1)%mBeats;
    }
  };
}
function mStart(){
  if(mPlaying)return;
  if(pPlaying)pStop();
  mPlaying=true;
  $('mPb').classList.add('on');
  $('mPi').innerHTML='<rect class="bar" x="6" y="5" width="4" height="14" rx="1"/><rect class="bar" x="14" y="5" width="4" height="14" rx="1"/>';
  startTransport(createMetroTransport());
  syncWakeLock();
}
function mStop(){
  mPlaying=false;
  stopTransport();
  $('mPb').classList.remove('on');
  $('mPi').innerHTML='<polygon class="tri" points="8,5 20,12 8,19"/>';
  clearDotLights('mDt');
  $('mBv').className='bv';
  syncWakeLock();
}
$('mPb').addEventListener('click',()=>{mPlaying?mStop():mStart()});
$('mSl').addEventListener('input',e=>mSetBpm(parseInt(e.target.value,10)));
document.querySelectorAll('#tab-metro .fb').forEach(b=>{b.addEventListener('click',()=>mSetBpm(mBpm+parseInt(b.dataset.d,10)))});
$('mTsSl').addEventListener('input',e=>{mBeats=clampBeats(parseInt(e.target.value,10));mUpd();mDots()});
$('mSubBtn').addEventListener('click',()=>{mSubdivision=cycleSubdivision(mSubdivision).key;mUpdSubdivision()});
let tapT=[];
$('tapB').addEventListener('click',()=>{
  const n=performance.now();
  tapT.push(n);
  if(tapT.length>6)tapT.shift();
  if(tapT.length<2)return;
  if(tapT[tapT.length-1]-tapT[tapT.length-2]>3000){tapT=[n];return}
  const iv=[];
  for(let i=1;i<tapT.length;i++){
    const d=tapT[i]-tapT[i-1];
    if(d<3000)iv.push(d);
  }
  if(iv.length>0)mSetBpm(Math.round(60000/(iv.reduce((a,b)=>a+b,0)/iv.length)));
});

let pBpm=120,pBeats=4,pPlaying=false,pSubdivision='none';
let ciOn=false,ciBts=4,isCi=false,ciBt=0;
let ecOn=false,ecBts=4,ecBef=true,isEc=false,ecBt=0;
let sTitle='',secs=[],curS=-1,curM=0;
let rF=0,rT=0;
let lib=[],curSId=null;
let lastTmp=120,lastBts=4;

function updateTempoTrend(){
  const el=$('pTrend'),sec=secs[curS];
  if(!el||!sec||sec.type!=='main'||isCi||isEc){if(el)el.textContent='';return}
  const end=sec.tempoEnd??sec.tempo;
  el.textContent=end>sec.tempo?'↗':end<sec.tempo?'↘':'';
}
function pUpd(){$('pBv').textContent=pBpm;$('pTn').textContent=tN(pBpm);updateTempoTrend()}
function pDots(n,subdivisionKey=pSubdivision){renderDots('pDt',n,subdivisionKey)}
function pUpdSubdivision(){$('pSubBtn').textContent=getSubdivisionState(pSubdivision).label;if(!isCi&&!isEc)pDots(pBeats,pSubdivision)}
function pSetPlay(){$('pPb').classList.add('on');$('pPi').innerHTML='<rect class="bar" x="6" y="5" width="4" height="14" rx="1"/><rect class="bar" x="14" y="5" width="4" height="14" rx="1"/>'}
function pSetStop(){$('pPb').classList.remove('on');$('pPi').innerHTML='<polygon class="tri" points="8,5 20,12 8,19"/>'}
function upSTB(){$('pST').innerHTML=sTitle?`<span>${sTitle}</span>`:''}
function upSB(){
  const sb=$('pSB');
  if(isCi){sb.innerHTML=`<span class="tg tg-ci">Count-in ${ciBt}/${ciBts}</span>`;return}
  if(isEc){sb.innerHTML=`<span class="tg tg-ec">End Check ${ecBt}/${ecBts}</span>`;return}
  if(secs.length===0){sb.innerHTML='';return}
  if(curS>=0&&curS<secs.length){
    const s=secs[curS];
    if(s.type==='end'){sb.innerHTML=`<span class="tg tg-end">End</span>`;return}
    const nm=s.name?` — ${s.name}`:'';
    sb.innerHTML=`<span class="tg tg-n">${s.label}${nm}</span><div class="mc">小節 ${curM+1}${s.measures>0?' / '+s.measures:' (手動)'}</div>`;
    return;
  }
  sb.innerHTML=`<span class="tg tg-off">${secs[rF]?.label||''} → ${secs[rT]?.label||''}</span>`;
}
function upRange(){
  const rf=$('rF'),rt=$('rT');
  rf.innerHTML='';
  rt.innerHTML='';
  secs.forEach((s,i)=>{
    const l=s.label+(s.name?' '+s.name:'');
    rf.innerHTML+=`<option value="${i}">${l}</option>`;
    rt.innerHTML+=`<option value="${i}">${l}</option>`;
  });
  if(secs.length>0){
    rF=Math.min(rF,secs.length-1);
    rT=Math.max(rF,Math.min(rT,secs.length-1));
    rf.value=rF;
    rt.value=rT;
  }
}
function updateAll(){pUpd();upSTB();upSB();upRange();renderSL();renderLL()}
function setPerformanceMainState(sectionIndex,measureIndex){
  const sec=secs[sectionIndex];
  curS=sectionIndex;
  curM=measureIndex;
  pBpm=clampTempo(sec&&sec.tempo);
  pBeats=clampBeats(sec&&sec.timeSig);
  isCi=false;
  isEc=false;
  ciBt=0;
  ecBt=0;
  pUpd();
  pDots(pBeats,pSubdivision);
  upSB();
  renderSL();
}
function enterCountInState(baseTempo){
  isCi=true;
  isEc=false;
  ciBt=0;
  pBpm=clampTempo(baseTempo);
  pUpd();
  pDots(ciBts,'none');
  upSB();
}
function enterEndCheckState(tempo){
  isCi=false;
  isEc=true;
  ecBt=0;
  pBpm=clampTempo(tempo);
  pUpd();
  pDots(ecBts,'none');
  upSB();
}
function createPerformanceTransport(){
  const c=ea();
  const firstSection=secs[rF]||null;
  const transport={
    isRunning:true,
    nextNoteTime:c.currentTime+.05,
    mode:'main',
    sectionIndex:rF,
    measureIndex:0,
    beatIndex:0,
    ciIndex:0,
    ecIndex:0,
    currentTempo:clampTempo(firstSection&&firstSection.tempo),
    currentBeats:clampBeats(firstSection&&firstSection.timeSig),
    finish(){this.isRunning=false},
    onComplete(){
      pPlaying=false;
      pSetStop();
      clearDotLights('pDt');
      $('pBv').className='bv';
      isCi=false;
      isEc=false;
      curS=-1;
      curM=0;
      upSB();
      updateTempoTrend();
      renderSL();
      syncWakeLock();
    },
    enterMain(sectionIndex,measureIndex,beatIndex){
      const sec=secs[sectionIndex];
      if(!sec){this.finish();return}
      this.mode='main';
      this.sectionIndex=sectionIndex;
      this.measureIndex=measureIndex;
      this.beatIndex=beatIndex;
      this.currentTempo=clampTempo(sec.tempo);
      this.currentBeats=clampBeats(sec.timeSig);
      setPerformanceMainState(sectionIndex,measureIndex);
    },
    enterCountIn(){
      this.mode='countIn';
      this.ciIndex=0;
      enterCountInState(this.currentTempo);
    },
    enterEndCheck(sourceSectionIndex){
      this.mode='endCheck';
      this.ecIndex=0;
      const sourceSection=secs[sourceSectionIndex]||secs[rF]||null;
      const targetSection=secs[rT]||sourceSection;
      const tempo=ecBef?clampTempo(sourceSection&&sourceSection.tempo):clampTempo(targetSection&&targetSection.tempo);
      this.currentTempo=tempo;
      this.currentBeats=ecBts;
      lastTmp=tempo;
      lastBts=ecBts;
      enterEndCheckState(tempo);
    },
    scheduleNext(time){
      if(this.mode==='countIn'){
        playClick('ci',time);
        queueVisual({panel:'perf',time,beatIndex:this.ciIndex,dotClass:'ci',flashClass:'f2'});
        return;
      }
      if(this.mode==='endCheck'){
        playClick('ci',time);
        queueVisual({panel:'perf',time,beatIndex:this.ecIndex,dotClass:'ec',flashClass:'f3'});
        return;
      }
      const sec=secs[this.sectionIndex];
      if(!sec){this.finish();return}
      if(sec.type==='end'){
        playClick('accent',time);
        queueVisual({panel:'perf',time,beatIndex:0,dotClass:'ed',flashClass:'f4'});
        return;
      }
      this.currentTempo=clampTempo(tempoAt(sec,progress(sec,this.beatIndex,this.measureIndex)));
      const accent=(this.currentBeats===1)||this.beatIndex===0;
      const beatDuration=60/this.currentTempo;
      playClick(accent?'accent':'normal',time);
      scheduleSubdivision(time,beatDuration,pSubdivision,'perf',this.beatIndex);
      queueVisual({panel:'perf',time,kind:'tempo',bpm:Math.round(this.currentTempo)});
      queueVisual({panel:'perf',time,beatIndex:this.beatIndex,dotClass:'on',flashClass:'f1'});
    },
    advance(){
      this.nextNoteTime+=60/this.currentTempo;
      if(this.mode==='countIn'){
        this.ciIndex++;
        ciBt=Math.min(this.ciIndex,ciBts);
        upSB();
        if(this.ciIndex>=ciBts){
          if(ecOn&&rF===rT)this.enterEndCheck(rF);
          else this.enterMain(rF,0,0);
        }
        return;
      }
      if(this.mode==='endCheck'){
        this.ecIndex++;
        ecBt=Math.min(this.ecIndex,ecBts);
        upSB();
        if(this.ecIndex>=ecBts)this.finish();
        return;
      }
      const sec=secs[this.sectionIndex];
      if(!sec){this.finish();return}
      if(sec.type==='end'){
        if(ecOn)this.enterEndCheck(this.sectionIndex);
        else this.finish();
        return;
      }
      this.beatIndex++;
      if(this.beatIndex>=this.currentBeats){
        this.beatIndex=0;
        this.measureIndex++;
        curM=this.measureIndex;
        upSB();
        if(sec.measures>0&&this.measureIndex>=sec.measures){
          lastTmp=this.currentTempo;
          lastBts=this.currentBeats;
          if(this.sectionIndex>=rT){
            if(ecOn)this.enterEndCheck(this.sectionIndex);
            else this.finish();
            return;
          }
          if(ecOn&&this.sectionIndex+1===rT&&rT>rF){
            this.enterEndCheck(this.sectionIndex);
            return;
          }
          this.enterMain(this.sectionIndex+1,0,0);
        }
      }
    }
  };

  if(firstSection){
    lastTmp=transport.currentTempo;
    lastBts=transport.currentBeats;
    if(ciOn)transport.enterCountIn();
    else if(ecOn&&rF===rT)transport.enterEndCheck(rF);
    else transport.enterMain(rF,0,0);
  }else{
    pBpm=120;
    pBeats=4;
    pUpd();
    pDots(4,'none');
    upSB();
    transport.finish();
  }
  return transport;
}
function pStart(){
  if(pPlaying)return;
  if(mPlaying)mStop();
  pPlaying=true;
  pSetPlay();
  curM=0;
  startTransport(createPerformanceTransport());
  syncWakeLock();
}
function pStop(){
  pPlaying=false;
  isCi=false;
  isEc=false;
  stopTransport();
  pSetStop();
  clearDotLights('pDt');
  $('pBv').className='bv';
  curS=-1;
  curM=0;
  upSB();
  updateTempoTrend();
  renderSL();
  syncWakeLock();
}
$('pPb').addEventListener('click',()=>{pPlaying?pStop():pStart()});
$('ciT').addEventListener('click',()=>{ciOn=!ciOn;$('ciT').classList.toggle('on',ciOn)});
$('ecT').addEventListener('click',()=>{ecOn=!ecOn;const e=$('ecT');e.classList.remove('on','og');if(ecOn)e.classList.add('og')});
$('ciS').querySelectorAll('.so').forEach(b=>{b.addEventListener('click',()=>{$('ciS').querySelectorAll('.so').forEach(x=>x.classList.remove('ap'));b.classList.add('ap');ciBts=parseInt(b.dataset.v,10)})});
$('ecBS').querySelectorAll('.so').forEach(b=>{b.addEventListener('click',()=>{$('ecBS').querySelectorAll('.so').forEach(x=>x.classList.remove('ag'));b.classList.add('ag');ecBts=parseInt(b.dataset.v,10)})});
$('ecTS').querySelectorAll('.so').forEach(b=>{b.addEventListener('click',()=>{$('ecTS').querySelectorAll('.so').forEach(x=>x.classList.remove('ag'));b.classList.add('ag');ecBef=b.dataset.v==='before'})});
$('pSubBtn').addEventListener('click',()=>{pSubdivision=cycleSubdivision(pSubdivision).key;pUpdSubdivision()});
$('rF').addEventListener('change',e=>{rF=parseInt(e.target.value,10);if(rT<rF){rT=rF;$('rT').value=rT}upSB()});
$('rT').addEventListener('change',e=>{rT=parseInt(e.target.value,10);if(rF>rT){rF=rT;$('rF').value=rF}upSB()});

function renderSL(){
  $('sList').innerHTML='';
  secs.forEach((s,i)=>{
    const c=document.createElement('div');
    let cls='sc';
    if(pPlaying&&i===curS)cls+=' playing';
    if(s.type==='end')cls+=' is-end';
    c.className=cls;
    if(s.type==='end'){
      c.innerHTML=`<div class="sch"><span class="slet el">End</span><input class="sni" type="text" value="${s.name}" placeholder="Ending" data-i="${i}" data-f="name"><button class="sdel" data-i="${i}">×</button></div>
        <div class="sfs f2"><div class="fg"><label>開始小節</label><input type="number" min="1" max="999" value="${s.startMeasure}" data-i="${i}" data-f="startMeasure"></div><div class="fg"><label>テンポ</label><input type="number" min="20" max="400" value="${s.tempo}" data-i="${i}" data-f="tempo"></div></div>`;
    }else{
      const mv=`<div class="smv"><button class="mvb" data-d="up" data-i="${i}">▲</button><button class="mvb" data-d="dn" data-i="${i}">▼</button></div>`;
      const te=s.tempoEnd??s.tempo,tc=s.tempoCurve??0,open=te!==s.tempo||tc!==0?' open':'';
      c.innerHTML=`<div class="sch">${mv}<span class="slet">${s.label}</span><input class="sni" type="text" value="${s.name}" placeholder="セクション名" data-i="${i}" data-f="name"><button class="sdel" data-i="${i}">×</button></div>
        <div class="sfs f4"><div class="fg"><label>開始小節</label><input type="number" min="1" max="999" value="${s.startMeasure}" data-i="${i}" data-f="startMeasure"></div><div class="fg"><label>小節数</label><input type="number" min="0" max="999" value="${s.measures}" data-i="${i}" data-f="measures"></div><div class="fg"><label>テンポ</label><input type="number" min="20" max="400" value="${s.tempo}" data-i="${i}" data-f="tempo"></div><div class="fg"><label>拍子</label><select data-i="${i}" data-f="timeSig">${[1,2,3,4,5,6,7,8].map(t=>`<option value="${t}"${t===s.timeSig?' selected':''}>${t===1?'1':t+'/4'}</option>`).join('')}</select></div></div>
        <details class="sdet"${open}><summary>詳細</summary><div class="sfs f2"><div class="fg"><label>終了テンポ</label><input type="number" min="20" max="400" value="${te}" data-i="${i}" data-f="tempoEnd"></div><div class="fg"><label>カーブ</label><input type="range" min="-1" max="1" step="0.1" value="${tc}" data-i="${i}" data-f="tempoCurve"><div class="curvev" data-cv="${i}">${Number(tc).toFixed(1)}</div></div></div></details>`;
    }
    $('sList').appendChild(c);
  });
  $('sList').querySelectorAll('input,select').forEach(el=>{
    el.addEventListener('change',e=>{
      const i=parseInt(e.target.dataset.i,10),f=e.target.dataset.f;
      if(isNaN(i))return;
      if(f==='name')secs[i].name=e.target.value;
      else if(f==='startMeasure'){secs[i].startMeasure=Math.max(1,parseInt(e.target.value,10)||1);e.target.value=secs[i].startMeasure}
      else if(f==='tempo'){const old=secs[i].tempo;secs[i].tempo=clampTempo(parseInt(e.target.value,10)||120);if(secs[i].tempoEnd==null||secs[i].tempoEnd===old)secs[i].tempoEnd=secs[i].tempo;e.target.value=secs[i].tempo}
      else if(f==='tempoEnd'){secs[i].tempoEnd=e.target.value===''?secs[i].tempo:clampTempo(parseInt(e.target.value,10)||secs[i].tempo);e.target.value=secs[i].tempoEnd}
      else if(f==='tempoCurve'){secs[i].tempoCurve=clampCurve(parseFloat(e.target.value));e.target.value=secs[i].tempoCurve;const cv=document.querySelector(`[data-cv="${i}"]`);if(cv)cv.textContent=secs[i].tempoCurve.toFixed(1)}
      else if(f==='timeSig')secs[i].timeSig=clampBeats(parseInt(e.target.value,10));
      else if(f==='measures'){secs[i].measures=Math.max(0,parseInt(e.target.value,10)||0);e.target.value=secs[i].measures}
      assignLabels();
      saveCur();
      upRange();
    });
    if(el.dataset.f==='tempoCurve')el.addEventListener('input',e=>{
      const i=parseInt(e.target.dataset.i,10);
      if(isNaN(i))return;
      secs[i].tempoCurve=clampCurve(parseFloat(e.target.value));
      const cv=document.querySelector(`[data-cv="${i}"]`);
      if(cv)cv.textContent=secs[i].tempoCurve.toFixed(1);
      saveCur();
    });
  });
  $('sList').querySelectorAll('.sdel').forEach(el=>{
    el.addEventListener('click',e=>{secs.splice(parseInt(e.currentTarget.dataset.i,10),1);assignLabels();renderSL();upSB();saveCur();upRange()});
  });
  $('sList').querySelectorAll('.mvb').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.dataset.i,10),d=el.dataset.d;
      if(secs[i].type==='end')return;
      if(d==='up'&&i>0&&secs[i-1].type!=='end'){[secs[i-1],secs[i]]=[secs[i],secs[i-1]]}
      else if(d==='dn'&&i<secs.length-1){
        if(secs[i+1].type==='end')return;
        [secs[i],secs[i+1]]=[secs[i+1],secs[i]];
      }else return;
      assignLabels();
      saveCur();
      upRange();
      renderSL();
    });
  });
}
$('addS').addEventListener('click',()=>{
  const endIdx=secs.findIndex(s=>s.type==='end');
  const ins=endIdx>=0?endIdx:secs.length;
  const prev=ins>0?secs[ins-1]:null;
  const sm=prev?(prev.startMeasure+(prev.measures||4)):1;
  secs.splice(ins,0,{type:'main',label:'',name:'',startMeasure:sm,measures:4,tempo:mBpm,tempoEnd:mBpm,tempoCurve:0,timeSig:mBeats});
  assignLabels();
  renderSL();
  saveCur();
  upRange();
  rT=Math.max(rT,secs.length-1);
  upRange();
});
$('addE').addEventListener('click',()=>{
  if(secs.some(s=>s.type==='end')){toast('エンドは1つのみ');return}
  const prev=secs.length>0?secs[secs.length-1]:null;
  const sm=prev?(prev.startMeasure+(prev.measures||4)):1;
  secs.push({type:'end',label:'End',name:'',startMeasure:sm,measures:1,tempo:mBpm,timeSig:mBeats});
  assignLabels();
  renderSL();
  saveCur();
  upRange();
  rT=secs.length-1;
  upRange();
});

function saveLib(){try{localStorage.setItem('metronome-lib',JSON.stringify(lib))}catch(e){}}
function loadLib(){try{const r=localStorage.getItem('metronome-lib');if(r)lib=JSON.parse(r);lib=lib.map(s=>({...s,sections:normalizeSections(s.sections)}))}catch(e){lib=[]}}
function saveCur(){if(!curSId)return;const i=lib.findIndex(s=>s.id===curSId);if(i>=0){lib[i].title=sTitle;lib[i].sections=JSON.parse(JSON.stringify(secs))}saveLib()}
function loadSong(s){curSId=s.id;sTitle=s.title;$('sT').value=sTitle;secs=normalizeSections(JSON.parse(JSON.stringify(s.sections||[])));assignLabels();curS=-1;curM=0;rF=0;rT=Math.max(0,secs.length-1);updateAll()}

function renderLL(){
  const l=$('lList');
  l.innerHTML='';
  if(lib.length===0){l.innerHTML='<div class="le">曲がありません</div>';return}
  lib.forEach(s=>{
    const c=document.createElement('div');
    c.className='lc'+(s.id===curSId?' cur':'');
    const mainCount=(s.sections||[]).filter(x=>x.type!=='end').length;
    c.innerHTML=`<div class="lci"><div class="lct">${s.title||'無題'}</div><div class="lcm">${mainCount} セクション</div></div>
      <div class="lca"><button class="lib" data-a="exp" data-id="${s.id}">↗</button><button class="lib dg" data-a="del" data-id="${s.id}">×</button></div>`;
    c.addEventListener('click',e=>{if(e.target.closest('.lib'))return;loadSong(s);switchTab('perf')});
    l.appendChild(c);
  });
  l.querySelectorAll('.lib').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const id=b.dataset.id,a=b.dataset.a;
      if(a==='del'){
        if(!confirm('削除？'))return;
        lib=lib.filter(s=>s.id!==id);
        if(curSId===id){curSId=null;sTitle='';$('sT').value='';secs=[];updateAll()}
        saveLib();
        renderLL();
      }
      if(a==='exp'){
        const s=lib.find(x=>x.id===id);
        if(s){$('exA').value=enc(s);$('exM').classList.add('show')}
      }
    });
  });
}
function switchTab(t){
  document.querySelectorAll('.tb').forEach(b=>{b.classList.remove('active');if(b.dataset.t===t)b.classList.add('active')});
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('active'));
  $('tab-'+t).classList.add('active');
  if(t==='song')renderSL();
  if(t==='lib')renderLL();
}
$('newS').addEventListener('click',()=>{saveCur();const id='s'+Date.now();const s={id,title:'',sections:[]};lib.push(s);saveLib();loadSong(s);switchTab('song')});
$('svL').addEventListener('click',()=>{
  sTitle=$('sT').value;
  if(!curSId){curSId='s'+Date.now();lib.push({id:curSId,title:sTitle,sections:JSON.parse(JSON.stringify(secs))})}
  else{
    const i=lib.findIndex(s=>s.id===curSId);
    if(i>=0){lib[i].title=sTitle;lib[i].sections=JSON.parse(JSON.stringify(secs))}
    else lib.push({id:curSId,title:sTitle,sections:JSON.parse(JSON.stringify(secs))});
  }
  saveLib();
  toast('保存しました');
  renderLL();
});

function enc(s){return btoa(unescape(encodeURIComponent(JSON.stringify({v:4,title:s.title||'',sections:(s.sections||[]).map(x=>({tp:x.type,n:x.name,sm:x.startMeasure,m:x.measures,t:x.tempo,te:x.tempoEnd,tc:x.tempoCurve,ts:x.timeSig}))}))))}
function dec(c){try{const d=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!d.sections)return null;return{title:d.title||'',sections:normalizeSections(d.sections)}}catch(e){return null}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
$('exB').addEventListener('click',()=>{sTitle=$('sT').value;saveCur();const s=curSId?lib.find(x=>x.id===curSId):null;$('exA').value=enc(s||{title:sTitle,sections:secs});$('exM').classList.add('show')});
$('exCl').addEventListener('click',()=>$('exM').classList.remove('show'));
$('exCp').addEventListener('click',()=>{$('exA').select();navigator.clipboard.writeText($('exA').value).then(()=>toast('コピーしました')).catch(()=>{document.execCommand('copy');toast('コピーしました')})});
$('imB').addEventListener('click',()=>{$('imA').value='';$('imM').classList.add('show')});
$('imCl').addEventListener('click',()=>$('imM').classList.remove('show'));
$('imLd').addEventListener('click',()=>{const d=dec($('imA').value);if(!d){toast('無効なコード');return}saveCur();const id='s'+Date.now();const s={id,title:d.title,sections:d.sections};lib.push(s);saveLib();loadSong(s);$('imM').classList.remove('show');toast('読み込みました')});
$('clB').addEventListener('click',()=>{if(!confirm('クリア？'))return;sTitle='';$('sT').value='';secs=[];curS=-1;curM=0;updateAll();saveCur()});
$('sT').addEventListener('input',e=>{sTitle=e.target.value;upSTB()});

document.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.t)));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){
    e.preventDefault();
    if($('tab-metro').classList.contains('active')){mPlaying?mStop():mStart()}
    else if($('tab-perf').classList.contains('active')){pPlaying?pStop():pStart()}
  }
  if(e.code==='ArrowUp'){e.preventDefault();if($('tab-metro').classList.contains('active'))mSetBpm(mBpm+1)}
  if(e.code==='ArrowDown'){e.preventDefault();if($('tab-metro').classList.contains('active'))mSetBpm(mBpm-1)}
});
['exM','imM'].forEach(id=>{$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).classList.remove('show')})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncWakeLock()});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
(()=>{loadLib();mDots();mUpd();mUpdSubdivision();pDots(4);pUpd();pUpdSubdivision();upSTB();upSB();upRange();renderLL()})();
</script>
</body>
</html>
